<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000"><style>text{font-family:'Segoe UI',Arial,sans-serif;font-variant-numeric:tabular-nums}*{shape-rendering:geometricPrecision}</style><rect x="0" y="0" width="1600" height="1000" fill="#F4F6F8" stroke="none" rx="0"/><rect x="0" y="0" width="620" height="968" fill="#12335B" stroke="none" rx="0"/><rect x="54" y="56" width="48" height="5" fill="#E7B641" stroke="none" rx="0"/><text x="54" y="109" font-size="22" fill="#FFFFFF" font-weight="700" >SYSTEMS PLUS</text><text x="54" y="139" font-size="18" fill="#FFFFFF" font-weight="600" >COMPUTER COLLEGE</text><text x="54" y="393" font-size="39" fill="#FFFFFF" font-weight="600" >Academic records,</text><text x="54" y="444" font-size="39" fill="#FFFFFF" font-weight="600" >clearly organized.</text><text x="56" y="500" font-size="17" fill="#CEDAEB" font-weight="400" >Student registration, enrollment and grading.</text><text x="56" y="530" font-size="17" fill="#CEDAEB" font-weight="400" >One consistent workspace for school staff.</text><line x1="56" y1="809" x2="560" y2="809" stroke="#355271"/><text x="56" y="843" font-size="12" fill="#CEDAEB" font-weight="600" >STUDENT RECORDS</text><text x="56" y="874" font-size="14" fill="#FFFFFF" font-weight="400" >Quezon City Campus</text><text x="744" y="164" font-size="32" fill="#12335B" font-weight="650" >Reset your password</text><text x="744" y="198" font-size="15" fill="#5B6B7B" font-weight="400" >We will send instructions through the configured school identity service.</text><text x="744" y="280" font-size="13" fill="#203247" font-weight="600" >Institutional email</text><rect x="744" y="292" width="510" height="42" fill="#FFFFFF" stroke="#D8E0E8" rx="3"/><text x="757" y="318" font-size="15" fill="#203247" font-weight="400" >maria@example.edu</text><rect x="744" y="374" width="510" height="40" fill="#12335B" stroke="none" rx="3"/><text x="999" y="399" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Send reset instructions</text><rect x="744" y="460" width="510" height="110" fill="#EDF3F9" stroke="none" rx="3"/><text x="765" y="491" font-size="17" fill="#12335B" font-weight="600" >Check your inbox</text><text x="765" y="520" font-size="14" fill="#5B6B7B" font-weight="400" >If this address has an active account, reset instructions</text><text x="765" y="543" font-size="14" fill="#5B6B7B" font-weight="400" >will arrive shortly. Contact your registrar if you need help.</text><text x="744" y="640" font-size="14" fill="#245B93" font-weight="600" >Back to sign in</text><rect x="744" y="891" width="175.29999999999998" height="27" fill="#FFF5D8" stroke="none" rx="3"/><text x="755" y="909" font-size="12" fill="#74520B" font-weight="600" >Proposed account flow</text><rect x="0" y="968" width="1600" height="32" fill="#FFFFFF" stroke="none" rx="0"/><line x1="0" y1="968" x2="1600" y2="968" stroke="#D8E0E8"/><text x="24" y="989" font-size="11" fill="#5B6B7B" font-weight="600" >SPCC / STUDENT RECORDS — DESIGN STUDY</text><text x="1574" y="989" font-size="11" fill="#5B6B7B" font-weight="400" text-anchor="end">Proposed feature · Synthetic data · 03</text></svg>