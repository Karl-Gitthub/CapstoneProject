ddle">Keep editing</text><rect x="268" y="522" width="610" height="294" fill="#FFFFFF" stroke="#D8E0E8" rx="3"/><text x="292" y="556" font-size="17" fill="#203247" font-weight="600" >Record changed</text><text x="292" y="610" font-size="17" fill="#12335B" font-weight="600" >Another staff member updated this record.</text><text x="292" y="647" font-size="14" fill="#5B6B7B" font-weight="400" >Reload the saved record before applying your changes.</text><rect x="292" y="700" width="204" height="40" fill="#FFFFFF" stroke="#D8E0E8" rx="3"/><text x="394" y="725" font-size="14" fill="#12335B" font-weight="600" text-anchor="middle">Reload latest record</text><rect x="902" y="522" width="650" height="294" fill="#FFFFFF" stroke="#D8E0E8" rx="3"/><text x="926" y="556" font-size="17" fill="#203247" font-weight="600" >Saved successfully</text><rect x="926" y="586" width="58.5" height="27" fill="#EAF3EE" stroke="none" rx="3"/><text x="937" y="604" font-size="12" fill="#23624A" font-weight="600" >Saved</text><text x="926" y="657" font-size="18" fill="#12335B" font-weight="600" >Ana Santos · DEMO-0148</text><text x="926" y="690" font-size="14" fill="#5B6B7B" font-weight="400" >The student record is now available in Students.</text><rect x="926" y="729" width="224" height="40" fill="#FFFFFF" stroke="#D8E0E8" rx="3"/><text x="1038" y="754" font-size="14" fill="#12335B" font-weight="600" text-anchor="middle">Open student record</text><rect x="0" y="968" width="1600" height="32" fill="#FFFFFF" stroke="none" rx="0"/><line x1="0" y1="968" x2="1600" y2="968" stroke="#D8E0E8"/><text x="24" y="989" font-size="11" fill="#5B6B7B" font-weight="600" >SPCC / STUDENT RECORDS — DESIGN STUDY</text><text x="1574" y="989" font-size="11" fill="#5B6B7B" font-weight="400" text-anchor="end">Design foundation · Synthetic data · 25</text></svg>